```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言葉探検・時間分析</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px 15px;
      background: #fff8e8;
      color: #333;
    }

    h1 {
      font-size: 28px;
    }

    button {
      font-size: 20px;
      padding: 14px 22px;
      border: none;
      border-radius: 18px;
      background: #398de3;
      color: white;
      margin: 8px;
    }

    #status {
      font-size: 20px;
      font-weight: bold;
      margin: 20px;
      min-height: 30px;
    }

    #records {
      max-width: 750px;
      margin: auto;
    }

    .record {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin: 20px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .record h2 {
      margin-top: 0;
    }

    .number {
      font-size: 18px;
      margin: 7px;
    }

    .number strong {
      font-size: 23px;
    }

    .section {
      margin-top: 15px;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    canvas {
      width: 100%;
      height: 220px;
      background: #fafafa;
      border: 1px solid #ccc;
      border-radius: 12px;
      margin-top: 10px;
    }

    #guide {
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>🔬 言葉探検・時間分析</h1>

  <p id="guide">
    マイクをスタートしたら、<br>
    「す！」または「つ！」と<br>
    短く発音してみよう。
  </p>

  <button id="mic">🎤 測定スタート</button>
  <button id="clear">🗑️ 記録を消す</button>

  <div id="status">
    ボタンを押してね
  </div>

  <div id="records"></div>


<script>

let audioContext = null;
let analyser = null;
let stream = null;

let measuring = false;
let recording = false;

let samples = [];

let recordStartTime = 0;

const RECORD_TIME = 800;

const mic = document.getElementById("mic");
const clearButton = document.getElementById("clear");
const status = document.getElementById("status");
const records = document.getElementById("records");


/* =========================
   マイク開始
========================= */

mic.onclick = async function() {

  if (measuring) return;

  status.textContent =
    "🎤 マイクを確認しています…";

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const source =
      audioContext.createMediaStreamSource(stream);

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 2048;

    source.connect(analyser);

    measuring = true;

    status.textContent =
      "🎤 発音すると自動で測定します！";

    detectSound();

  } catch (error) {

    status.textContent =
      "マイクを使えませんでした：" +
      error.name;

    console.log(error);
  }

};


/* =========================
   音を監視
========================= */

function detectSound() {

  if (!analyser || !measuring) return;

  const data =
    new Uint8Array(analyser.fftSize);

  analyser.getByteTimeDomainData(data);

  let sum = 0;

  for (const value of data) {

    const n =
      (value - 128) / 128;

    sum += n * n;
  }

  const rms =
    Math.sqrt(sum / data.length);

  const volume =
    rms * 500;


  /*
   * 音が一定以上になったら
   * 記録開始
   */

  if (
    volume > 20 &&
    !recording
  ) {

    startRecording();
  }


  /*
   * 記録中
   */

  if (recording) {

    collectData(data);
  }


  requestAnimationFrame(detectSound);
}


/* =========================
   記録開始
========================= */

function startRecording() {

  recording = true;

  samples = [];

  recordStartTime = performance.now();

  status.textContent =
    "📸 音を分析しています…";
}


/* =========================
   データ収集
========================= */

function collectData(data) {

  const now =
    performance.now();

  const elapsed =
    now - recordStartTime;


  /*
   * 振れ幅
   */

  let max = 0;
  let min = 255;

  for (const value of data) {

    if (value > max) max = value;
    if (value < min) min = value;

  }

  const amplitude =
    max - min;


  /*
   * 波の細かさ
   */

  let crossings = 0;

  let previous =
    data[0] - 128;

  for (
    let i = 1;
    i < data.length;
    i++
  ) {

    const current =
      data[i] - 128;

    if (
      (previous < 0 && current >= 0) ||
      (previous > 0 && current <= 0)
    ) {

      crossings++;
    }

    previous = current;
  }


  /*
   * 高音÷低音
   */

  const frequencyData =
    new Uint8Array(
      analyser.frequencyBinCount
    );

  analyser.getByteFrequencyData(
    frequencyData
  );

  let low = 0;
  let high = 0;

  for (
    let i = 0;
    i < frequencyData.length;
    i++
  ) {

    const value =
      frequencyData[i];

    if (i < 20) {
      low += value;
    }

    if (i > 100) {
      high += value;
    }
  }

  const ratio =
    low > 0
      ? high / low
      : 0;


  samples.push({

    time: elapsed,
    amplitude: amplitude,
    crossings: crossings,
    ratio: ratio

  });


  /*
   * 0.8秒で終了
   */

  if (elapsed >= RECORD_TIME) {

    finishRecording();
  }

}


/* =========================
   指定時間帯の平均
========================= */

function averageByTime(start, end) {

  const selected =
    samples.filter(
      s => s.time >= start && s.time < end
    );


  if (selected.length === 0) {

    return {
      amplitude: 0,
      crossings: 0,
      ratio: 0
    };

  }


  let amplitude = 0;
  let crossings = 0;
  let ratio = 0;


  for (const s of selected) {

    amplitude += s.amplitude;
    crossings += s.crossings;
    ratio += s.ratio;

  }


  return {

    amplitude:
      amplitude / selected.length,

    crossings:
      crossings / selected.length,

    ratio:
      ratio / selected.length

  };

}


/* =========================
   測定終了
========================= */

function finishRecording() {

  recording = false;


  if (samples.length === 0) {

    status.textContent =
      "音を検出できませんでした。";

    return;
  }


  /*
   * 全体平均
   */

  const all =
    averageByTime(0, RECORD_TIME);


  /*
   * 前半・中間・後半
   */

  const first =
    averageByTime(0, 200);

  const middle =
    averageByTime(200, 400);

  const last =
    averageByTime(400, 800);


  /*
   * 記録表示
   */

  const record =
    document.createElement("div");

  record.className =
    "record";


  const number =
    records.children.length + 1;


  record.innerHTML = `

    <h2>📸 発音 ${number}</h2>

    <div class="section">

      <h3>⏱ 時間ごとの「細かさ」</h3>

      <div class="number">
        前半（0～0.2秒）：
        <strong>
          ${first.crossings.toFixed(1)}
        </strong>
      </div>

      <div class="number">
        中間（0.2～0.4秒）：
        <strong>
          ${middle.crossings.toFixed(1)}
        </strong>
      </div>

      <div class="number">
        後半（0.4～0.8秒）：
        <strong>
          ${last.crossings.toFixed(1)}
        </strong>
      </div>

    </div>


    <div class="section">

      <h3>📊 全体の平均</h3>

      <div class="number">
        振れ幅：
        <strong>
          ${all.amplitude.toFixed(1)}
        </strong>
      </div>

      <div class="number">
        細かさ：
        <strong>
          ${all.crossings.toFixed(1)}
        </strong>
      </div>

      <div class="number">
        高音 ÷ 低音：
        <strong>
          ${all.ratio.toFixed(2)}
        </strong>
      </div>

    </div>


    <canvas width="700" height="220"></canvas>
  `;


  records.prepend(record);


  /*
   * 波形を描く
   */

  const canvas =
    record.querySelector("canvas");

  const ctx =
    canvas.getContext("2d");


  /*
   * 中央線
   */

  ctx.beginPath();

  ctx.moveTo(
    0,
    canvas.height / 2
  );

  ctx.lineTo(
    canvas.width,
    canvas.height / 2
  );

  ctx.strokeStyle =
    "#cccccc";

  ctx.stroke();


  /*
   * 波形
   */

  ctx.beginPath();


  /*
   * サンプル全体を横方向に配置
   */

  const total =
    samples.length;

  for (
    let i = 0;
    i < total;
    i++
  ) {

    const x =
      i / (total - 1) *
      canvas.width;

    /*
     * 細かさを簡易的に
     * 波形として表示
     *
     * 実際の音声波形ではなく、
     * 各時間の細かさを表示する。
     */

    const normalized =
      samples[i].crossings / 600;

    const y =
      canvas.height / 2 -
      Math.min(100, normalized * 200);


    if (i === 0) {

      ctx.moveTo(x, y);

    } else {

      ctx.lineTo(x, y);

    }

  }


  ctx.strokeStyle =
    "#398de3";

  ctx.lineWidth = 3;

  ctx.stroke();


  status.textContent =
    "✅ 測定完了！もう一度発音できます。";
}


/* =========================
   記録を消す
========================= */

clearButton.onclick = function() {

  records.innerHTML = "";

  status.textContent =
    "記録を消しました。";

};

</script>

</body>
</html>
```
