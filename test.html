<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言葉探検 音の実験室</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px 15px;
      background: #fff8e8;
      color: #333;
    }

    h1 {
      font-size: 28px;
    }

    button {
      font-size: 21px;
      padding: 15px 24px;
      border: none;
      border-radius: 18px;
      background: #398de3;
      color: white;
      margin: 10px;
    }

    #status {
      font-size: 20px;
      font-weight: bold;
      margin: 20px;
      min-height: 30px;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 700px;
      height: 250px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      border: 2px solid #ccc;
    }

    .record {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin: 20px auto;
      max-width: 700px;
      text-align: left;
    }

    .record h2 {
      margin-top: 0;
      text-align: center;
    }

    .number {
      font-size: 18px;
      margin: 6px 0;
    }

    #guide {
      font-size: 19px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>🔬 言葉探検・音の実験室</h1>

  <p id="guide">
    マイクをスタートしたら、<br>
    「あ！」「す！」「う！」と<br>
    短く発音してみよう。
  </p>

  <button id="mic">🎤 測定スタート</button>
  <button id="clear">🗑️ 記録を消す</button>

  <div id="status">
    ボタンを押してね
  </div>

  <canvas id="graph" width="700" height="250"></canvas>

  <div id="records"></div>


<script>

let audioContext = null;
let analyser = null;
let stream = null;

let measuring = false;
let lastSoundTime = 0;

const mic = document.getElementById("mic");
const clearButton = document.getElementById("clear");
const status = document.getElementById("status");
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
const records = document.getElementById("records");


mic.onclick = async function() {

  if (measuring) return;

  status.textContent =
    "🎤 マイクを確認しています…";

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const source =
      audioContext.createMediaStreamSource(stream);

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 2048;

    source.connect(analyser);

    measuring = true;

    status.textContent =
      "🎤 「あ！」「す！」「う！」と発音してね！";

    drawLive();

  } catch (error) {

    status.textContent =
      "マイクを使えませんでした：" +
      error.name;

    console.log(error);
  }

};


function drawLive() {

  if (!analyser || !measuring) return;

  const data =
    new Uint8Array(analyser.fftSize);

  analyser.getByteTimeDomainData(data);

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.beginPath();

  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    const x =
      i / data.length * canvas.width;

    const y =
      data[i] / 255 * canvas.height;

    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

  }

  ctx.stroke();

  detectSound(data);

  requestAnimationFrame(drawLive);
}


function detectSound(data) {

  let sum = 0;

  for (const value of data) {

    const n =
      (value - 128) / 128;

    sum += n * n;
  }

  const rms =
    Math.sqrt(sum / data.length);

  const volume =
    rms * 500;


  if (
    volume > 25 &&
    Date.now() - lastSoundTime > 1200
  ) {

    lastSoundTime = Date.now();

    saveMeasurement();
  }

}


function saveMeasurement() {

  const frequencyData =
    new Uint8Array(
      analyser.frequencyBinCount
    );

  analyser.getByteFrequencyData(
    frequencyData
  );

  let low = 0;
  let high = 0;

  for (
    let i = 0;
    i < frequencyData.length;
    i++
  ) {

    const value =
      frequencyData[i];

    if (i < 20) {
      low += value;
    }

    if (i > 100) {
      high += value;
    }

  }

  const ratio =
    low > 0 ? high / low : 0;

  const time =
    new Date().toLocaleTimeString();

  const record =
    document.createElement("div");

  record.className =
    "record";

  record.innerHTML = `
    <h2>📸 発音データ</h2>

    <div class="number">
      時刻：${time}
    </div>

    <div class="number">
      高音÷低音：
      <strong>${ratio.toFixed(2)}</strong>
    </div>

    <p>
      このグラフは、発音したときの
      音の波の形です。
    </p>
  `;

  records.prepend(record);

  status.textContent =
    "📸 記録しました！ 次の音をどうぞ。";
}


clearButton.onclick = function() {

  records.innerHTML = "";

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  status.textContent =
    "記録を消しました。";

};

</script>

</body>
</html>
