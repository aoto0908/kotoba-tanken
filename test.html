<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言葉探検 音の実験室</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px 15px;
      background: #fff8e8;
      color: #333;
    }

    h1 {
      font-size: 28px;
    }

    button {
      font-size: 21px;
      padding: 15px 24px;
      border: none;
      border-radius: 18px;
      background: #398de3;
      color: white;
      margin: 10px;
    }

    #status {
      font-size: 20px;
      font-weight: bold;
      margin: 20px;
      min-height: 30px;
    }

    .record {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin: 20px auto;
      max-width: 700px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .record h2 {
      margin-top: 0;
    }

    .number {
      font-size: 20px;
      margin: 8px;
    }

    .number strong {
      font-size: 25px;
    }

    canvas {
      width: 100%;
      height: 220px;
      background: #fafafa;
      border: 1px solid #ccc;
      border-radius: 12px;
    }

    #guide {
      font-size: 19px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>🔬 言葉探検・音の実験室</h1>

  <p id="guide">
    マイクをスタートしたら、<br>
    「あ！」「す！」「う！」と<br>
    短く発音してみよう。
  </p>

  <button id="mic">🎤 測定スタート</button>
  <button id="clear">🗑️ 記録を消す</button>

  <div id="status">
    ボタンを押してね
  </div>

  <div id="records"></div>


<script>

let audioContext = null;
let analyser = null;
let stream = null;

let measuring = false;
let lastSoundTime = 0;

const mic = document.getElementById("mic");
const clearButton = document.getElementById("clear");
const status = document.getElementById("status");
const records = document.getElementById("records");


mic.onclick = async function() {

  if (measuring) return;

  status.textContent =
    "🎤 マイクを確認しています…";

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const source =
      audioContext.createMediaStreamSource(stream);

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 2048;

    source.connect(analyser);

    measuring = true;

    status.textContent =
      "🎤 「あ！」「す！」「う！」と発音してね！";

    detectSound();

  } catch (error) {

    status.textContent =
      "マイクを使えませんでした：" +
      error.name;

    console.log(error);
  }

};


function detectSound() {

  if (!analyser || !measuring) return;

  const data =
    new Uint8Array(analyser.fftSize);

  analyser.getByteTimeDomainData(data);

  let sum = 0;
  let max = 0;
  let min = 255;

  for (const value of data) {

    const n =
      (value - 128) / 128;

    sum += n * n;

    if (value > max) max = value;
    if (value < min) min = value;
  }

  const rms =
    Math.sqrt(sum / data.length);

  const volume =
    rms * 500;


  if (
    volume > 25 &&
    Date.now() - lastSoundTime > 1200
  ) {

    lastSoundTime = Date.now();

    saveMeasurement(data, max, min);
  }


  requestAnimationFrame(detectSound);
}


function saveMeasurement(waveData, max, min) {

  /*
   * ① 振れ幅
   */

  const amplitude =
    max - min;


  /*
   * ② 波の細かさ
   *
   * 波形が中央線（128）を
   * 何回通過したかを数える。
   */

  let crossings = 0;

  let previous =
    waveData[0] - 128;


  for (
    let i = 1;
    i < waveData.length;
    i++
  ) {

    const current =
      waveData[i] - 128;

    if (
      (previous < 0 && current >= 0) ||
      (previous > 0 && current <= 0)
    ) {

      crossings++;
    }

    previous = current;
  }


  /*
   * ③ 高音÷低音
   */

  const frequencyData =
    new Uint8Array(
      analyser.frequencyBinCount
    );

  analyser.getByteFrequencyData(
    frequencyData
  );


  let low = 0;
  let high = 0;


  for (
    let i = 0;
    i < frequencyData.length;
    i++
  ) {

    const value =
      frequencyData[i];

    if (i < 20) {
      low += value;
    }

    if (i > 100) {
      high += value;
    }

  }


  const ratio =
    low > 0 ? high / low : 0;


  /*
   * 記録を表示
   */

  const record =
    document.createElement("div");

  record.className =
    "record";


  const number =
    records.children.length + 1;


  record.innerHTML = `
    <h2>📸 発音 ${number}</h2>

    <div class="number">
      振れ幅：
      <strong>${amplitude}</strong>
    </div>

    <div class="number">
      波の細かさ：
      <strong>${crossings}</strong>
    </div>

    <div class="number">
      高音 ÷ 低音：
      <strong>${ratio.toFixed(2)}</strong>
    </div>

    <canvas width="700" height="220"></canvas>
  `;


  records.prepend(record);


  /*
   * 波形を描く
   */

  const canvas =
    record.querySelector("canvas");

  const ctx =
    canvas.getContext("2d");


  // 中央線

  ctx.beginPath();

  ctx.moveTo(
    0,
    canvas.height / 2
  );

  ctx.lineTo(
    canvas.width,
    canvas.height / 2
  );

  ctx.strokeStyle =
    "#cccccc";

  ctx.stroke();


  // 波形

  ctx.beginPath();


  for (
    let i = 0;
    i < waveData.length;
    i++
  ) {

    const x =
      i / waveData.length *
      canvas.width;

    const y =
      waveData[i] / 255 *
      canvas.height;


    if (i === 0) {

      ctx.moveTo(x, y);

    } else {

      ctx.lineTo(x, y);

    }

  }


  ctx.strokeStyle =
    "#398de3";

  ctx.lineWidth = 2;

  ctx.stroke();


  status.textContent =
    "📸 3つの特徴を記録しました！";
}


clearButton.onclick = function() {

  records.innerHTML = "";

  status.textContent =
    "記録を消しました。";

};

</script>

</body>
</html>
