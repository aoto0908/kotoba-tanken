<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言葉探検「すー！」</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px 20px;
      background: #eef9ff;
      color: #333;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    #mission {
      font-size: 24px;
      font-weight: bold;
      margin: 25px 0;
    }

    #target {
      font-size: 48px;
      font-weight: bold;
      margin: 20px;
    }

    button {
      font-size: 24px;
      padding: 20px 35px;
      border: none;
      border-radius: 20px;
      background: #398de3;
      color: white;
      margin: 20px 0;
    }

    button:active {
      transform: scale(0.95);
    }

    #status {
      font-size: 22px;
      font-weight: bold;
      margin: 20px;
      min-height: 32px;
    }

    #levelBox {
      width: 90%;
      max-width: 400px;
      height: 30px;
      background: #ddd;
      border-radius: 20px;
      margin: 25px auto;
      overflow: hidden;
    }

    #level {
      width: 0%;
      height: 100%;
      background: #65c58a;
      transition: width 0.1s;
    }

    #message {
      font-size: 24px;
      font-weight: bold;
      margin-top: 30px;
      min-height: 40px;
    }

    #count {
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>🎤 言葉探検</h1>

  <div id="mission">
    ミッション！
  </div>

  <div id="target">
    「すー！」
  </div>

  <button id="mic">
    🎤 スタート
  </button>

  <div id="status">
    ボタンを押してね
  </div>

  <div id="levelBox">
    <div id="level"></div>
  </div>

  <div id="message"></div>

  <div id="count">
    チャレンジ：0回
  </div>

<script>

let stream = null;
let audioContext = null;
let analyser = null;
let animationId = null;

let challengeCount = 0;
let success = false;

const status = document.getElementById("status");
const level = document.getElementById("level");
const message = document.getElementById("message");
const mic = document.getElementById("mic");
const count = document.getElementById("count");


mic.onclick = async function() {

  status.textContent = "マイクを確認しています…";
  message.textContent = "";

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.textContent =
      "このページではマイクが使えません";

    return;
  }

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    status.textContent =
      "🎤 「すー！」と言ってみよう！";

    message.textContent =
      "声を出してみてね";

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const source =
      audioContext.createMediaStreamSource(stream);

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 1024;

    source.connect(analyser);

    success = false;

    checkSound();

  } catch (error) {

    status.textContent =
      "マイクを使えませんでした";

    message.textContent =
      "エラー：" + error.name;

    console.log(error);
  }

};


function checkSound() {

  if (!analyser) return;

  const data =
    new Uint8Array(analyser.fftSize);

  analyser.getByteTimeDomainData(data);

  let sum = 0;

  for (const value of data) {

    const n = (value - 128) / 128;

    sum += n * n;
  }

  const rms =
    Math.sqrt(sum / data.length);

  const percent =
    Math.min(100, rms * 500);

  level.style.width =
    percent + "%";


  // 一定以上の声が出たら成功
  if (percent > 25 && !success) {

    success = true;

    challengeCount++;

    count.textContent =
      "チャレンジ：" +
      challengeCount +
      "回";

    status.textContent =
      "🌟 じょうず！";

    message.textContent =
      "「すー！」の声が聞こえたよ！";

    mic.textContent =
      "🎤 もう一回！";
  }


  animationId =
    requestAnimationFrame(checkSound);
}

</script>

</body>
</html>
