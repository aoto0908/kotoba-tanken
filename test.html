```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言葉探検 音の実験室</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 25px 15px;
      background: #fff8e8;
      color: #333;
    }

    h1 {
      font-size: 28px;
    }

    button {
      font-size: 21px;
      padding: 16px 25px;
      border: none;
      border-radius: 18px;
      background: #398de3;
      color: white;
      margin: 12px;
    }

    #status {
      font-size: 20px;
      font-weight: bold;
      margin: 20px;
      min-height: 30px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin: 12px auto;
      max-width: 500px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .number {
      font-size: 27px;
      font-weight: bold;
      margin-top: 5px;
    }

    #result {
      margin-top: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px 4px;
      font-size: 16px;
    }

    th {
      background: #eee;
    }

    #guide {
      font-size: 19px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>🔬 言葉探検・音の実験室</h1>

  <p id="guide">
    マイクをスタートしたら、<br>
    「あ！」「す！」「う！」と<br>
    短く発音してみよう。
  </p>

  <button id="mic">🎤 測定スタート</button>
  <button id="clear">🗑️ 記録を消す</button>

  <div id="status">
    ボタンを押してね
  </div>

  <div id="result"></div>

<script>

let audioContext = null;
let analyser = null;
let stream = null;

let lastSoundTime = 0;
let measuring = false;

const mic = document.getElementById("mic");
const clearButton = document.getElementById("clear");
const status = document.getElementById("status");
const result = document.getElementById("result");


mic.onclick = async function() {

  if (measuring) return;

  status.textContent =
    "🎤 マイクを確認しています…";

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const source =
      audioContext.createMediaStreamSource(stream);

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 2048;

    source.connect(analyser);

    measuring = true;

    status.textContent =
      "🎤 「あ！」「す！」「う！」と発音してね！";

    detectSound();

  } catch (error) {

    status.textContent =
      "マイクを使えませんでした：" +
      error.name;

    console.log(error);
  }

};


function detectSound() {

  if (!analyser || !measuring) return;

  const data =
    new Uint8Array(analyser.fftSize);

  analyser.getByteTimeDomainData(data);

  let sum = 0;

  for (const value of data) {

    const n =
      (value - 128) / 128;

    sum += n * n;
  }

  const rms =
    Math.sqrt(sum / data.length);

  const volume =
    rms * 500;


  // 声を検知したら測定
  if (
    volume > 25 &&
    Date.now() - lastSoundTime > 1000
  ) {

    lastSoundTime = Date.now();

    measureFrequency();

  }


  requestAnimationFrame(detectSound);
}


function measureFrequency() {

  const data =
    new Uint8Array(analyser.frequencyBinCount);

  analyser.getByteFrequencyData(data);

  let low = 0;
  let high = 0;
  let total = 0;

  for (let i = 0; i < data.length; i++) {

    const value = data[i];

    total += value;

    if (i < 20) {
      low += value;
    }

    if (i > 100) {
      high += value;
    }
  }

  const ratio =
    low > 0 ? high / low : 0;

  addResult(
    Math.round(total / data.length),
    Math.round(low),
    Math.round(high),
    ratio.toFixed(2)
  );

}


function addResult(
  volume,
  low,
  high,
  ratio
) {

  const time =
    new Date().toLocaleTimeString();

  const row =
    document.createElement("tr");

  row.innerHTML = `
    <td>${time}</td>
    <td>${volume}</td>
    <td>${low}</td>
    <td>${high}</td>
    <td>${ratio}</td>
  `;

  let table =
    document.getElementById("dataTable");

  if (!table) {

    result.innerHTML = `
      <div class="box">
        <h2>📊 測定結果</h2>

        <table>
          <thead>
            <tr>
              <th>時刻</th>
              <th>音量</th>
              <th>低音</th>
              <th>高音</th>
              <th>高音÷低音</th>
            </tr>
          </thead>

          <tbody id="dataTable"></tbody>
        </table>
      </div>
    `;

    table =
      document.getElementById("dataTable");
  }

  table.appendChild(row);

  status.textContent =
    "📸 測定しました！ 次の発音をどうぞ。";
}


clearButton.onclick = function() {

  result.innerHTML = "";

  status.textContent =
    "記録を消しました。";

};

</script>

</body>
</html>
